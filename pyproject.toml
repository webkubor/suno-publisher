[project]
name = "suno-publisher"
version = "0.1.0"
description = "AI 音乐发行台 —— 台账、平台账号、填表自动化，停在不可逆动作之前"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "webkubor" }]
keywords = ["music", "publish", "distribution", "suno", "automation"]
dependencies = [
    # 发行服务（web/app.py）要它 —— 这是本仓对外的**唯一**入口，扩展和界面都打它。
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
# 发布脚本要驱动浏览器填表；主仓本身只做台账和 HTTP 契约，不装这些。
automation = [
    "playwright>=1.40",
]

[project.scripts]
# 原来指向 `cli.app:main`，但本仓**没有 cli/ 目录** —— 装完跑 `suno-publisher`
# 会 ModuleNotFoundError。真正的入口是发行服务，指向它。
suno-publisher = "web.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "web*"]
